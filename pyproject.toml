[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-telegram-notifier"
version = "0.2.1"
description = "Catch Django exceptions and send formatted error reports to Telegram with optional database logging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jakhongir Ganiev", email = "contact@jakhongir.dev" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["django", "telegram", "exception", "error", "notification", "monitoring"]
dependencies = [
    "django>=5.2",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/ganiyevuz/django-telegram-notifier"
Repository = "https://github.com/ganiyevuz/django-telegram-notifier"
Issues = "https://github.com/ganiyevuz/django-telegram-notifier/issues"

[dependency-groups]
dev = [
    "django-jazzmin>=3.0.4",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_notifier"]

[tool.hatch.build.targets.sdist]
include = [
    "src/telegram_notifier",
    "LICENSE",
    "README.md",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["telegram_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
DJANGO_SETTINGS_MODULE = "tests.settings"
env_files = [".env"]
